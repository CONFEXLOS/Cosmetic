name: Apply definitive BeautyLink repair

on:
  push:
    branches:
      - feat/beautylink-africa-mvp
    paths:
      - "repair/**"
      - ".github/workflows/apply-definitive-repair.yml"

permissions:
  contents: write

concurrency:
  group: beautylink-definitive-repair
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/beautylink-africa-mvp
          fetch-depth: 0

      - name: Rebuild clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/beautylink-payload /tmp/beautylink-unpacked

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          source = ''.join(Path('repair/chunks/part-06.b64').read_text().split())
          expected_length = 11256
          expected_hash = 'f1e590238bc9637acdcd417a9ddfbaf58a392b6b1e4749c43a258a9cd25c985f'

          def digest(value: str) -> str:
              return hashlib.sha256(value.encode()).hexdigest()

          clean = None
          if len(source) == expected_length and digest(source) == expected_hash:
              clean = source
          elif len(source) == expected_length + 4:
              for index in range(len(source) - 3):
                  candidate = source[:index] + source[index + 4:]
                  if digest(candidate) == expected_hash:
                      clean = candidate
                      print(f'Removed four corrupt characters at offset {index}.')
                      break

          if clean is None:
              raise SystemExit(
                  f'Unable to normalize final chunk: length={len(source)} sha256={digest(source)}'
              )

          Path('/tmp/beautylink-payload/part-06.clean.b64').write_text(clean)
          PY

          cat \
            repair/chunks/part-00a.b64 \
            repair/chunks/part-00b.b64 \
            repair/chunks/part-01.b64 \
            repair/chunks/part-02.b64 \
            repair/chunks/part-03a.b64 \
            repair/chunks/part-03b.b64 \
            repair/chunks/part-04.b64 \
            repair/chunks/part-05.b64 \
            /tmp/beautylink-payload/part-06.clean.b64 \
            | tr -d '[:space:]' \
            > /tmp/beautylink-payload/repository.clean.b64

          base64 -d /tmp/beautylink-payload/repository.clean.b64 \
            > /tmp/beautylink-payload/repository.zip

          echo "7017114d0299e702571c1efbd3d4be6140187a270dc69ee15f0420b8e28962b3  /tmp/beautylink-payload/repository.zip" \
            | sha256sum --check

          unzip -t /tmp/beautylink-payload/repository.zip
          unzip -q /tmp/beautylink-payload/repository.zip -d /tmp/beautylink-unpacked

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/beautylink-unpacked/. .

          npm run check
          npm run build
          rm -rf dist

      - name: Commit definitive repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BeautyLink Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace corrupted scaffold with stable BeautyLink MVP [repair-applied]"
          git push origin HEAD:feat/beautylink-africa-mvp
